# Turned off on 2026-11-23 (MOSA-1727). Rule of 2026-11-22: nothing runs on GitHub-hosted
# runners. This repository has no ha3 runner, so the automatic triggers are removed and the
# jobs name the ha3 labels: a manual run waits for a runner instead of using hosted minutes.
# To turn it on again: Infra Ops registers an ha3 runner for this repository, then restore
# the triggers from the commit before this one.
name: image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, ha3]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/m-esm/handpan:${{ github.sha }}
            ghcr.io/m-esm/handpan:main-${{ github.run_number }}-${{ steps.tag.outputs.sha7 }}

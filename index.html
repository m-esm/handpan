<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14110e">
  <title>DISC D Kurd</title>
  <meta name="description" content="Practice patterns for a 10-note D Kurd handpan. The pan and the note list light up together.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2314110e'/%3E%3Ccircle cx='16' cy='16' r='12' fill='%23a86b3c'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e6b15a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="#/">DISC</a>
      <p class="scale">10-note D Kurd at 440 Hz</p>
    </header>
    <main class="split">
      <div class="pan-stick">
        <div class="stage-tools">
          <p id="caption" class="caption">Tap a note to hear it.</p>
          <button id="listen" type="button" aria-pressed="false">Listen</button>
          <button id="mirror" type="button" aria-pressed="false">Mirror</button>
        </div>
        <div id="mic" class="mic" hidden>
          <span class="mic-dot" aria-hidden="true"></span>
          <span id="mic-text" class="mic-text"></span>
          <span class="mic-meter" aria-hidden="true"><span id="mic-fill"></span></span>
          <label class="mic-pick"><span class="sr">Input source</span><select id="mic-input"></select></label>
        </div>
        <div id="pan"></div>
        <p id="status" class="sr" role="status"></p>
      </div>
      <div id="learn"></div>
      <section id="dock" aria-label="Patterns"></section>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
  <script src="js/live.js" defer></script>
</body>
</html>

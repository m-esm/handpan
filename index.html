<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10232b">
  <title>Alamut | A courtyard for sound</title>
  <meta name="description" content="Find your rhythm in Alamut. Play a ten-note D Kurd handpan, discover melodies, and learn each piece at your own pace in a moonlit Persian courtyard.">
  <link rel="icon" type="image/svg+xml" href="img/alamut-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Aref+Ruqaa:wght@700&family=Vazirmatn:wght@400;500;600;700&family=Markazi+Text:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="wrap" inert>
    <header class="top">
      <a class="brand" href="#/" aria-label="Alamut home" data-i18n-label="brand.home"><img src="img/alamut-mark.svg" width="34" height="34" alt=""><span data-i18n="brand">Alamut</span></a>
      <button id="tools-toggle" type="button" aria-expanded="false" aria-controls="tools" data-i18n="tools">Tools</button>
      <div id="tools" class="tools">
        <button id="listen" type="button" aria-pressed="false" aria-describedby="mic-context" title="Use the microphone to hear your handpan" data-i18n="mic" data-i18n-title="mic.hint">Microphone</button>
        <span id="mic-context" class="tool-context" hidden data-i18n="mic.context">Learn uses screen notes. Microphone is available in Play.</span>
        <button id="mirror" type="button" aria-pressed="false" title="Swap the left and right sides of the handpan" data-i18n="mirror" data-i18n-title="mirror.hint">Mirror</button>
        <div class="motion-controls" hidden><button id="motion-toggle" type="button" aria-pressed="false" data-i18n="motion.enable">Enable motion</button><button id="motion-center" type="button" hidden data-i18n="motion.recenter">Recenter</button></div>
        <label class="scene-pick"><span class="sr" data-i18n="scene.pick">Landscape</span><select id="environment"><option value="auto" data-i18n="scene.auto">Follow the music</option></select></label>
        <button id="explore-world" type="button" data-i18n="explore">Explore</button>
        <button id="language" type="button" class="lang-switch" lang="en"></button>
      </div>
    </header>
    <main class="split">
      <div class="pan-stick">
        <div id="mic" class="mic" hidden>
          <span class="mic-dot" aria-hidden="true"></span>
          <span id="mic-text" class="mic-text"></span>
          <span class="mic-meter" aria-hidden="true"><span id="mic-fill"></span></span>
          <label class="mic-pick"><span class="sr" data-i18n="mic.input">Input source</span><select id="mic-input"></select></label>
        </div>
        <div id="pan"></div>
        <section id="game" class="game" hidden aria-label="Playing score" data-i18n-label="game.label" data-tier="0" style="--q: 0">
          <div class="game-medallion">
            <span class="game-ring" aria-hidden="true"></span>
            <span id="game-note" class="game-note">&ndash;</span>
          </div>
          <div class="game-read">
            <span id="game-word" class="game-word" data-i18n="game.start">Strike a note</span>
            <span id="game-sub" class="game-sub" data-i18n="game.start.sub">Clean strikes build a streak and wake the courtyard.</span>
          </div>
          <div class="game-streak">
            <strong id="game-streak">0</strong>
            <span class="game-label" data-i18n="game.streak">streak</span>
          </div>
          <dl class="game-stats">
            <div><dt data-i18n="game.best">Best</dt><dd id="game-best">0</dd></div>
            <div><dt data-i18n="game.combo">Combo</dt><dd id="game-combo">&times;1</dd></div>
            <div><dt data-i18n="game.points">Points</dt><dd id="game-points">0</dd></div>
          </dl>
          <div class="game-tier">
            <span class="game-lanterns" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span id="game-tier" class="game-tier-name" data-i18n="tier.Ember">Ember</span>
            <span id="game-tier-next" class="game-tier-next"></span>
          </div>
          <p id="game-pop" class="game-pop" role="status"></p>
        </section>
        <p id="caption" class="caption sr" data-i18n="caption.tap">Tap a note to hear it.</p>
        <p id="motion-status" role="status"></p>
        <p id="scene-notice" class="scene-notice" role="status" hidden></p>
        <p id="status" class="sr" role="status"></p>
      </div>
      <div id="learn"></div>
      <section id="dock" aria-label="Library" data-i18n-label="library"></section>
    </main>
  </div>
  <div id="scene-loader" class="scene-loader" role="status" aria-live="polite">
    <img src="img/alamut-mark.svg" width="72" height="72" alt="">
    <span class="loader-name" data-i18n="brand">Alamut</span>
    <p id="loading-message" data-i18n="loader.opening">Opening the courtyard</p>
    <span class="loading-track" aria-hidden="true"></span>
    <button id="simple-view" type="button" data-i18n="loader.simple">Continue in simple view</button>
  </div>
  <noscript><style>#scene-loader{display:none}</style><p>Enable JavaScript to play and learn with Alamut.</p></noscript>
  <script>try{var l=localStorage.getItem("disc-kurd-lang");if(!l&&(navigator.languages||[navigator.language]).some(function(c){return /^fa\b/i.test(c||"")}))l="fa";if(l==="fa"){document.documentElement.lang="fa";document.documentElement.dir="rtl";}}catch(e){}</script>
  <script type="module" src="js/main.js"></script>
  <script src="js/live.js" defer></script>
</body>
</html>

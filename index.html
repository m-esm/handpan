<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10232b">
  <title>Alamut | A courtyard for sound</title>
  <meta name="description" content="Find your rhythm in Alamut. Play a ten-note D Kurd handpan, discover melodies, and learn each piece at your own pace in a moonlit Persian courtyard.">
  <link rel="icon" type="image/svg+xml" href="img/alamut-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="wrap" inert>
    <header class="top">
      <a class="brand" href="#/" aria-label="Alamut home"><img src="img/alamut-mark.svg" width="38" height="38" alt=""><span>Alamut</span><span class="brand-place">A courtyard for sound</span></a>
      <div class="header-tools"><p class="scale">D Kurd <span>10 notes / 440 Hz</span></p><button id="library-toggle" type="button" aria-expanded="true" aria-controls="dock">Hide music</button></div>
    </header>
    <main class="split">
      <div class="pan-stick">
        <div class="scene-heading"><h1>A courtyard for sound.</h1><p>Settle in. Find a melody. Follow its rhythm.</p><button id="explore-world" type="button">Explore Alamut <span aria-hidden="true">↗</span></button><button class="browse-music" type="button">Browse music ↓</button></div>
        <div class="stage-tools">
          <p id="caption" class="caption">Tap a note to hear it.</p>
          <button id="listen" type="button" aria-pressed="false">Listen</button>
          <button id="mirror" type="button" aria-pressed="false">Mirror</button>
        </div>
        <div id="mic" class="mic" hidden>
          <span class="mic-dot" aria-hidden="true"></span>
          <span id="mic-text" class="mic-text"></span>
          <span class="mic-meter" aria-hidden="true"><span id="mic-fill"></span></span>
          <label class="mic-pick"><span class="sr">Input source</span><select id="mic-input"></select></label>
        </div>
        <div id="pan"></div>
        <p id="scene-notice" class="scene-notice" role="status" hidden></p>
        <div class="stage-footer"><span>Brass <b>left hand</b></span><span class="stage-seal" aria-hidden="true">✧</span><span>Ivory <b>right hand</b></span></div>
        <div class="environment-picker"><span id="environment-name">The lantern courtyard</span><label><span class="sr">Landscape</span><select id="environment"><option value="auto">Follow the music</option></select></label></div>
        <p id="status" class="sr" role="status"></p>
      </div>
      <div id="learn"></div>
      <section id="dock" aria-label="Patterns"></section>
    </main>
  </div>
  <div id="scene-loader" class="scene-loader" role="status" aria-live="polite">
    <img src="img/alamut-mark.svg" width="72" height="72" alt="">
    <span class="loader-name">Alamut</span>
    <p id="loading-message">Opening the courtyard</p>
    <span class="loading-track" aria-hidden="true"></span>
    <button id="simple-view" type="button">Continue in simple view</button>
  </div>
  <noscript><style>#scene-loader{display:none}</style><p>Enable JavaScript to play and learn with Alamut.</p></noscript>
  <script type="module" src="js/main.js"></script>
  <script src="js/live.js" defer></script>
</body>
</html>

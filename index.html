<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10232b">
  <title>Alamut | A courtyard for sound</title>
  <meta name="description" content="Find your rhythm in Alamut. Play a ten-note D Kurd handpan, discover melodies, and learn each piece at your own pace in a moonlit Persian courtyard.">
  <link rel="icon" type="image/svg+xml" href="img/alamut-mark.svg">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="wrap" inert>
    <header class="top">
      <a class="brand" href="#/" aria-label="Alamut home"><img src="img/alamut-mark.svg" width="34" height="34" alt=""><span>Alamut</span></a>
      <button id="tools-toggle" type="button" aria-expanded="false" aria-controls="tools">Tools</button>
      <div id="tools" class="tools">
        <button id="listen" type="button" aria-pressed="false" aria-describedby="mic-context" title="Use the microphone to hear your handpan">Microphone</button>
        <span id="mic-context" class="tool-context" hidden>Learn uses screen notes. Microphone is available in Play.</span>
        <button id="mirror" type="button" aria-pressed="false" title="Swap the left and right sides of the handpan">Mirror</button>
        <div class="motion-controls" hidden><button id="motion-toggle" type="button" aria-pressed="false">Enable motion</button><button id="motion-center" type="button" hidden>Recenter</button></div>
        <label class="scene-pick"><span class="sr">Landscape</span><select id="environment"><option value="auto">Follow the music</option></select></label>
        <button id="explore-world" type="button">Explore</button>
      </div>
    </header>
    <main class="split">
      <div class="pan-stick">
        <div id="mic" class="mic" hidden>
          <span class="mic-dot" aria-hidden="true"></span>
          <span id="mic-text" class="mic-text"></span>
          <span class="mic-meter" aria-hidden="true"><span id="mic-fill"></span></span>
          <label class="mic-pick"><span class="sr">Input source</span><select id="mic-input"></select></label>
        </div>
        <div id="pan"></div>
        <p id="caption" class="caption">Tap a note to hear it.</p>
        <p class="keyboard-hint">Play with keys <kbd>0</kbd>–<kbd>9</kbd> · <kbd>T</kbd> for tak</p>
        <p id="motion-status" role="status"></p>
        <p id="scene-notice" class="scene-notice" role="status" hidden></p>
        <p id="status" class="sr" role="status"></p>
      </div>
      <div id="learn"></div>
      <section id="dock" aria-label="Library"></section>
    </main>
  </div>
  <div id="scene-loader" class="scene-loader" role="status" aria-live="polite">
    <img src="img/alamut-mark.svg" width="72" height="72" alt="">
    <span class="loader-name">Alamut</span>
    <p id="loading-message">Opening the courtyard</p>
    <span class="loading-track" aria-hidden="true"></span>
    <button id="simple-view" type="button">Continue in simple view</button>
  </div>
  <noscript><style>#scene-loader{display:none}</style><p>Enable JavaScript to play and learn with Alamut.</p></noscript>
  <script type="module" src="js/main.js"></script>
  <script src="js/live.js" defer></script>
</body>
</html>

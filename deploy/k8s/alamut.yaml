# Static Alamut site.
# Flux applies the live copy from m-esm/cluster-moshes-lab under
# apps/tenant-moshes-lab/alamut. This file is the in-repo shape.
# Image tags on the cluster are ghcr.io/m-esm/handpan:<git-sha>.
# Namespace tenant-moshes-lab was chosen on MOSA-30.
# Host alamut.moshes.io was chosen on MOSA-30. TLS is on the cluster IngressRoute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alamut
  namespace: tenant-moshes-lab
  labels:
    app.kubernetes.io/name: alamut
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alamut
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alamut
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alamut
          image: ghcr.io/m-esm/handpan:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: cache
          emptyDir:
            sizeLimit: 16Mi
        - name: run
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alamut
  namespace: tenant-moshes-lab
  labels:
    app.kubernetes.io/name: alamut
spec:
  selector:
    app.kubernetes.io/name: alamut
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alamut
  namespace: tenant-moshes-lab
  labels:
    app.kubernetes.io/name: alamut
spec:
  rules:
    - host: alamut.moshes.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alamut
                port:
                  name: http

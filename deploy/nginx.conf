# Alamut on k3s.
# /            practice app (index.html)
# /landing     landing page
# /features    features page
# /p/<id>      one static page per pattern, generated by scripts/seo.mjs
# /app/        asset prefix kept for old links; /app/ itself redirects to /
# The .html forms that GitHub Pages links to (index.html, landing.html,
# features.html, p/<id>.html) redirect to the canonical paths above, and
# alamut.moshes.io redirects to handpan.moshes.io so crawlers see one host.
# Hosts, TLS and the Deployment live in m-esm/cluster-moshes-lab apps/alamut.

server {
  listen 8080;
  server_name alamut.moshes.io;
  server_tokens off;
  return 308 https://handpan.moshes.io$request_uri;
}

server {
  listen 8080 default_server;
  server_name handpan.moshes.io _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;

  location = / {
    try_files /index.html =404;
  }

  location = /landing {
    try_files /landing.html =404;
  }

  location = /features {
    try_files /features.html =404;
  }

  location = /app {
    return 301 /;
  }

  location = /app/ {
    return 301 /;
  }

  location /app/ {
    rewrite ^/app/(.*)$ /$1 break;
    try_files $uri $uri.html =404;
  }

  location = /index.html {
    return 301 /;
  }

  location = /landing.html {
    return 301 /landing;
  }

  location = /features.html {
    return 301 /features;
  }

  location = /p/index.html {
    return 301 /p/;
  }

  location ~ ^/p/(.+)\.html$ {
    return 301 /p/$1;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
  }

  location /deploy/ {
    return 404;
  }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
}

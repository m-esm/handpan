# Alamut on k3s.
# /            landing page
# /features    features page
# /app/        practice app, including css, js, img, and hash routes
# Relative links used by GitHub Pages (index.html, landing.html, features.html)
# keep working because those files are also served from the site root.
# The Ingress host is alamut.moshes.io. This server does not terminate TLS.

server {
  listen 80;
  server_name alamut.moshes.io;
  root /usr/share/nginx/html;
  server_tokens off;

  location = / {
    rewrite ^ /landing.html last;
  }

  location = /features {
    rewrite ^ /features.html last;
  }

  location = /app {
    return 308 /app/;
  }

  location = /app/ {
    rewrite ^ /index.html last;
  }

  location /app/ {
    rewrite ^/app/(.*)$ /$1 break;
    try_files $uri =404;
  }

  location /deploy/ {
    return 404;
  }

  location / {
    try_files $uri =404;
  }
}
